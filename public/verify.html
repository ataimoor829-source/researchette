<style>
/* A plain, readable document page: one glass card, a short contents list, numbered sections. */
body { font-size: 1.0625rem; line-height: 1.65; }
.wrap { width: 100%; max-width: 820px; margin-inline: auto; padding-inline: 22px; }
.nav { position: sticky; top: 0; z-index: 40; padding-top: env(safe-area-inset-top, 0px); }
.nav .wrap { max-width: none; padding-inline: clamp(16px, 3vw, 44px); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-links a:not(.btn) { color: var(--muted); text-decoration: none; padding: .45em .85em; border-radius: 999px; font-size: .93rem; }
.nav-links a:not(.btn):hover { color: var(--ink); background: var(--pen-soft); }
@media (max-width: 480px) { .nav-links a.home-link { display: none; } .nav-links a:not(.btn) { padding-inline: .6em; } }
.hero { padding-block: clamp(48px, 9vw, 100px) clamp(28px, 5vw, 48px); display: grid; gap: 16px; }
.hero h1 { font-size: clamp(2.2rem, 1.5rem + 3.4vw, 3.6rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.hero .lede { color: var(--muted); font-size: 1.08rem; max-width: 56ch; }
.hero .updated { font-size: .85rem; color: var(--muted); letter-spacing: .01em; }
.doc { padding: clamp(24px, 5vw, 48px); display: grid; gap: 34px; counter-reset: clause; }
.toc { display: grid; gap: 10px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.toc ol { margin: 0; padding-left: 1.3em; columns: 2 220px; column-gap: 28px; font-size: .95rem; }
.toc li { padding-block: 3px; break-inside: avoid; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--pen); }
.clause { display: grid; gap: 12px; scroll-margin-top: 90px; }
.clause h2 { font-size: clamp(1.2rem, 1.1rem + .5vw, 1.45rem); letter-spacing: -.02em; line-height: 1.25; }
.clause h2::before { counter-increment: clause; content: counter(clause) ". "; color: var(--teal); }
.clause p, .clause li { color: var(--ink); max-width: 68ch; }
.clause ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.clause b { font-weight: 600; }
.note { border-radius: 16px; padding: 14px 16px; background: var(--pen-soft); font-size: .95rem; }
.foot { padding-block: 56px 36px; }
.foot-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; padding-top: 28px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); align-items: center; }
.foot-row a:not(.logo) { color: var(--muted); }
</style>
<link rel="stylesheet" href="/assets/liquid.css">
<style>
.vf { display: grid; gap: 22px; max-width: 640px; }
.vf-form { display: flex; gap: 10px; padding: 10px; border-radius: 20px; }
.vf-form input { flex: 1; min-width: 0; font: 600 1.05rem var(--f-mono, monospace); letter-spacing: .06em; text-transform: uppercase; padding: .8em 1em; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-strong, #fff); color: var(--ink); }
.vf-form input:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
.vf-res { padding: clamp(20px, 4vw, 30px); display: grid; gap: 14px; border-radius: 22px; }
.vf-res[hidden] { display: none; }
.vf-badge { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-weight: 700; font-size: .9rem; padding: .45em .9em; border-radius: 99px; }
.vf-badge svg { width: 18px; height: 18px; }
.vf-res.ok .vf-badge { background: var(--teal-soft); color: var(--teal); }
.vf-res.bad .vf-badge { background: var(--red-soft, rgba(221,68,96,.1)); color: var(--redpen); }
.vf-res h2 { font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem); }
.vf-dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0; font-size: .98rem; }
.vf-dl dt { color: var(--muted); }
.vf-dl dd { margin: 0; font-weight: 600; }
@media (max-width: 480px) { .vf-form { flex-direction: column; } .vf-dl { grid-template-columns: 1fr; gap: 2px; } .vf-dl dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="nav">
  <div class="wrap">
    <div class="nav-inner">
      <a class="logo" href="/" aria-label="Researchette home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="7" fill="#3448D8"/><path d="M5 13h3l2-5 3 9 2-4h4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>research<i>ette</i></span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a class="home-link" href="/">Home</a>
        <a href="/learn/">Learn research</a>
        <a href="/privacy">Privacy</a>
        <a class="btn btn-primary btn-sm" href="/#join">Join</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero vf">
    <span class="eyebrow">Certificate check</span>
    <h1>Verify a certificate.</h1>
    <p class="lede">Every Researchette certificate has a unique code. Enter it below, or scan the QR code on the certificate, to see who it was issued to.</p>
    <form class="vf-form glass" id="vf" novalidate>
      <label class="sr" for="vf-code" style="position:absolute;left:-9999px">Certificate code</label>
      <input id="vf-code" name="c" placeholder="RT-2026-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="30" required>
      <button class="btn btn-primary" type="submit">Verify</button>
    </form>
    <div class="vf-res glass" id="vf-res" role="status" aria-live="polite" hidden></div>
  </section>
</main>
<script>
(function () {
  var f = document.getElementById('vf'), inp = document.getElementById('vf-code'), out = document.getElementById('vf-res');
  var ok = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
  var no = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function date(iso) { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function show(html, cls) { out.className = 'vf-res glass ' + cls; out.innerHTML = html; out.hidden = false; }
  function check(code) {
    code = code.trim().toUpperCase().replace(/\s+/g, '');
    if (!code) { inp.focus(); return; }
    inp.value = code;
    try { history.replaceState(null, '', '?c=' + encodeURIComponent(code)); } catch (e) {}
    show('<span class="muted">Checking…</span>', '');
    fetch('/api/verify/' + encodeURIComponent(code)).then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (c) {
      if (c && c.valid) show('<span class="vf-badge">' + ok + 'Valid certificate</span><h2>' + esc(c.name) + '</h2><p class="muted">completed the <b>' + esc(c.programme) + '</b> programme at Researchette.</p>' +
        '<dl class="vf-dl"><dt>Programme</dt><dd>' + esc(c.programme) + '</dd><dt>Issued</dt><dd>' + date(c.issuedAt) + '</dd>' + (c.mentor ? '<dt>Mentor</dt><dd>' + esc(c.mentor) + '</dd>' : '') + '<dt>Code</dt><dd>' + esc(c.code) + '</dd></dl>', 'ok');
      else if (c && c.revoked) show('<span class="vf-badge">' + no + 'Certificate revoked</span><p>Certificate <b>' + esc(c.code) + '</b> was issued to ' + esc(c.name) + ' but has since been withdrawn by Researchette, so it is no longer valid.</p>', 'bad');
      else show('<span class="vf-badge">' + no + 'Not found</span><p>No certificate has the code <b>' + esc(code) + '</b>. Check it was typed exactly as printed, including the dashes.</p>', 'bad');
    }, function () { show('<span class="vf-badge">' + no + 'Couldn’t check</span><p>We couldn’t reach the server. Check your connection and try again.</p>', 'bad'); });
  }
  f.addEventListener('submit', function (e) { e.preventDefault(); check(inp.value); });
  var q = new URLSearchParams(location.search).get('c'); if (q) check(q);
})();
</script>

<script src="/assets/menu.js"></script>
<script src="/assets/fx.js"></script>
</body>
</html>
